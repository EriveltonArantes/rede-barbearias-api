spring.application.name=rede-barbearias-api

# Banco: H2 em memoria no desenvolvimento, Postgres em producao via DATABASE_URL
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:barbearias;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
# Neon/Render gratis limitam conexoes: pool pequeno e sem segurar conexao ociosa
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=120000
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.h2.console.enabled=${H2_CONSOLE:false}

# Upload de fotos (barbeiros, produtos, logos)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.serialization.write-dates-as-timestamps=false

# Seguranca: em producao sempre definir JWT_SECRET (>= 32 caracteres)
jwt.secret=${JWT_SECRET:dev-only-troque-em-producao-9f2c7a1e4b8d6f03a5c9e2b7d1f4a8c6}
jwt.expiracao-horas=${JWT_EXPIRACAO_HORAS:12}

# Seed de demonstracao (so roda com o banco vazio)
app.seed=${APP_SEED:true}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Regras de negocio configuraveis
app.fidelidade.pontos-resgate=${FIDELIDADE_PONTOS_RESGATE:10}
app.agenda.intervalo-minutos=15
app.agenda.antecedencia-cancelamento-horas=2
app.agenda.dias-maximos-antecedencia=60
app.pix.chave=${PIX_CHAVE:contato@redebarbearias.com.br}
app.pix.nome-recebedor=${PIX_NOME:REDE BARBEARIAS}
app.pix.cidade=${PIX_CIDADE:BELO HORIZONTE}

# Rate limit das rotas publicas (agendamento online sem login)
app.publico.limite-por-janela=30
app.publico.janela-minutos=10

# ---------------- Notificacoes automaticas (confirmacao, lembrete do dia e 1h antes, avaliacao) ----------------
# E-mail: qualquer SMTP (Brevo gratis: smtp-relay.brevo.com:587). Sem SMTP_HOST o canal fica desligado.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
app.notificacoes.remetente=${MAIL_FROM:}
app.notificacoes.remetente-nome=${MAIL_FROM_NAME:Rede Barbearias}
# WhatsApp oficial (Meta Cloud API). Sem token/phone-number-id o canal fica desligado.
app.whatsapp.token=${WHATSAPP_TOKEN:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.api-versao=${WHATSAPP_API_VERSAO:v21.0}
app.whatsapp.idioma=pt_BR
# Webhook (resposta automatica quando o cliente escreve): token que voce inventa e cadastra na Meta + App Secret do app
app.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
app.whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
# Sinal por Pix com confirmacao automatica (Mercado Pago). Sem token: Pix estatico e a recepcao confere.
app.mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
app.mercadopago.email-padrao=${MERCADOPAGO_EMAIL_PADRAO:pagamentos@redebarbearias.com.br}
# Endereco publico desta API (o Render preenche RENDER_EXTERNAL_URL sozinho)
app.api-url=${API_URL:${RENDER_EXTERNAL_URL:}}
# Link do site usado nas mensagens (consultar/cancelar/avaliar/agendar)
app.site-url=${SITE_URL:https://rede-barbearias-api-frontend.vercel.app}
# Lembrete do dia sai a partir dessa hora; o segundo lembrete sai X minutos antes do horario (0 desliga);
# pedido de avaliacao sai X minutos depois do pagamento
app.notificacoes.hora-lembrete=${LEMBRETE_HORA:7}
app.notificacoes.lembrete-antes-minutos=${LEMBRETE_ANTES_MINUTOS:60}
app.notificacoes.avaliacao-apos-minutos=${AVALIACAO_APOS_MINUTOS:90}

management.health.mail.enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
