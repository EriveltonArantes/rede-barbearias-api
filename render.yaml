services:
  - type: web
    name: rede-barbearias-api
    runtime: docker
    # free "dorme" apos ~15 min sem acesso: os lembretes automaticos nao saem enquanto dorme.
    # Pra barbearia de verdade use starter (sempre ligado).
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        value: admin123
      # Banco: cole a URL do Neon/Render como vem (postgresql://usuario:senha@host/banco?sslmode=require).
      # Sem ela o sistema usa H2 em memoria e perde tudo a cada reinicio.
      - key: DATABASE_URL
        sync: false
      # false = sistema vazio pra barbearia de verdade (so cria o admin)
      - key: APP_SEED
        value: "true"
      # WhatsApp oficial (painel > Notificacoes tem o passo a passo)
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      # Sinal por Pix com confirmacao automatica (opcional)
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      # Endereco do site usado nos links das mensagens (troque ao usar dominio proprio)
      - key: SITE_URL
        value: https://rede-barbearias-api-frontend.vercel.app
